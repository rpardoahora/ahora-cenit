# Stack completo de ahora-cenit: Traefik + Portainer + Docker Registry +
# portal (app) + SQL Server + OpenObserve (telemetría).
#
# No lo edites para configurar la instalación: install.sh / install.ps1
# generan infra/.env con todas las variables (dominio, contraseñas, API key
# de Portainer...). Este fichero sirve tal cual para el modo local (HTTP);
# en producción el instalador añade docker-compose.prod.yml (HTTPS con
# Let's Encrypt) mediante COMPOSE_FILE en el .env, así que desde esta carpeta
# basta con `docker compose up -d`, `docker compose ps`, `docker compose logs`...
#
# Hosts publicados (DOMAIN = localhost en local, tu dominio en producción):
#   cloud.DOMAIN      portal ahora-cenit (UI + /api)
#   portainer.DOMAIN  Portainer
#   traefik.DOMAIN    dashboard de Traefik (usuario admin)
#   registry.DOMAIN   Docker Registry privado (usuario admin)
#   telemetry.DOMAIN  OpenObserve (trazas, métricas y logs)
#   nuget.DOMAIN      BaGetter: repositorio NuGet privado (feed en /v3/index.json)
#   <slug>.DOMAIN     instancias de producto desplegadas desde el portal

name: cenit

networks:
  # Red compartida con los stacks de producto que despliega el portal.
  proxy:
    name: proxy
    external: true
  internal:
    name: cenit_internal
  # SQL Server común (APPS_SQL_MODE=shared): las aplicaciones que lo usan se unen
  # a esta red y lo ven como "cenit-sqlserver". Solo él está en ella por parte de
  # la plataforma.
  sql:
    name: cenit_sql

volumes:
  portainer_data:
    name: cenit_portainer_data
  registry_data:
    name: cenit_registry_data
  sqlserver_data:
    name: cenit_sqlserver_data
  openobserve_data:
    name: cenit_openobserve_data
  nuget_data:
    name: cenit_nuget_data
  letsencrypt:
    name: cenit_letsencrypt

services:
  traefik:
    image: traefik:${TRAEFIK_VERSION:-v3.6}
    restart: unless-stopped
    networks:
      - proxy
    ports:
      # En local puede ser otro (p.ej. 8880 si IIS ocupa el 80); en producción siempre 80.
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./auth:/auth:ro
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --log.level=INFO
    labels:
      traefik.enable: "true"
      traefik.http.routers.traefik.rule: Host(`traefik.${DOMAIN}`)
      traefik.http.routers.traefik.service: api@internal
      traefik.http.routers.traefik.middlewares: cenit-auth
      traefik.http.middlewares.cenit-auth.basicauth.usersfile: /auth/htpasswd

  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-lts}
    restart: unless-stopped
    # El entorno "local" (Docker del host vía socket) lo da de alta el instalador por API.
    networks:
      - proxy
    ports:
      # Solo en loopback: lo usa el instalador para configurar Portainer por API.
      - "127.0.0.1:${PORTAINER_LOCAL_PORT:-9000}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.portainer.rule: Host(`portainer.${DOMAIN}`)
      traefik.http.services.portainer.loadbalancer.server.port: "9000"

  registry:
    image: registry:${REGISTRY_VERSION:-3}
    restart: unless-stopped
    networks:
      - proxy
    ports:
      # En local el Docker del host hace pull/push contra localhost:5000
      # (Docker solo acepta registries sin HTTPS si están en localhost).
      - "127.0.0.1:${REGISTRY_LOCAL_PORT:-5000}:5000"
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: ahora-cenit registry
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
      REGISTRY_HTTP_RELATIVEURLS: "true"
      OTEL_TRACES_EXPORTER: none
    volumes:
      - registry_data:/var/lib/registry
      - ./auth:/auth:ro
    labels:
      traefik.enable: "true"
      traefik.http.routers.registry.rule: Host(`registry.${DOMAIN}`)
      traefik.http.services.registry.loadbalancer.server.port: "5000"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Express: gratuita y permitida en producción (máx. 10 GB por base de datos).
      # Developer solo vale para desarrollo/pruebas. Ver THIRD-PARTY-NOTICES.md.
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      internal:
      sql:
        aliases: [cenit-sqlserver]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 20

  app:
    image: ${APP_IMAGE:-ghcr.io/rpardoahora/ahora-cenit}:${APP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=sqlserver,1433;Database=AhoraCenit;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ahora-cenit
      Jwt__ExpiresMinutes: "480"
      Portainer__Url: http://portainer:9000
      Portainer__ApiKey: ${PORTAINER_API_KEY:-}
      Portainer__EndpointId: ${PORTAINER_ENDPOINT_ID:-1}
      BaseDomain: ${DOMAIN}
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      Auth__RequireEmailConfirmation: ${REQUIRE_EMAIL_CONFIRMATION:-false}
      # Valor INICIAL de "permitir el registro abierto"; luego manda lo que el admin fije en el panel (Ajustes).
      Auth__RegistrationEnabled: ${REGISTRATION_ENABLED:-false}
      # dedicated: cada app con su propio SQL Server; shared: todas en el de la plataforma.
      AppsSql__Mode: ${APPS_SQL_MODE:-dedicated}
      # Papelera: días que pasan las instancias y los clientes borrados antes de eliminarse del todo.
      Trash__RetentionDays: ${TRASH_RETENTION_DAYS:-7}
      # Explorador de BBDD bajo demanda: imagen y minutos sin uso tras los que se para.
      SqlAdmin__Image: dbeaver/cloudbeaver:${CLOUDBEAVER_VERSION:-26.2.2}
      SqlAdmin__IdleMinutes: ${SQLADMIN_IDLE_MINUTES:-5}
      # Feed que reciben las apps (instalación desatendida): las URLs del repositorio NuGet de la plataforma
      # se traducen a http://cenit-nuget:8080/v3/index.json y se usa el usuario de solo lectura cenit-apps.
      AppsSql__NugetPublicUrls: ${NUGET_PUBLIC_URL:-},http://localhost:${NUGET_LOCAL_PORT:-5100}/,${PUBLIC_SCHEME}://nuget.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}/
      AppsSql__NugetUser: cenit-apps
      # Panel de productos: últimas versiones publicadas en el registry y en el repositorio NuGet (por la red interna).
      Feeds__RegistryHosts: ${REGISTRY_HOST:-localhost:5000},localhost:${REGISTRY_LOCAL_PORT:-5000},registry.${DOMAIN},registry.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      Feeds__RegistryPublicUrl: ${PUBLIC_SCHEME}://registry.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      Feeds__NugetPublicUrls: ${NUGET_PUBLIC_URL:-},http://localhost:${NUGET_LOCAL_PORT:-5100}/,${PUBLIC_SCHEME}://nuget.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}/
      Feeds__User: cenit-admin
      Feeds__Password: ${CENIT_TOKEN:-}
      AppsSql__NugetPassword: ${NUGET_READ_TOKEN:-}
      Auth__PublicBaseUrl: ${PUBLIC_SCHEME}://cloud.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__From: ${SMTP_FROM:-}
      # Token de plataforma: autentica la API del portal (Bearer / X-Api-Key).
      ApiAuth__Tokens: ${CENIT_TOKEN:-}
      # La web del repositorio NuGet es nuget.DOMAIN (por Traefik, con login); el feed para dotnet va aparte
      # porque en local dotnet no resuelve *.localhost y usa localhost:5100.
      AdminTools__NuGetFeedUrl: ${NUGET_PUBLIC_URL:-}v3/index.json
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_USER: ${ADMIN_EMAIL}
      OTEL_EXPORTER_OTLP_PASSWORD: ${ADMIN_PASSWORD}
    networks:
      internal:
      proxy:
        # Nombre fijo para el forwardAuth del explorador de BBDD (lo consulta Traefik).
        aliases: [cenit-portal]
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.app.rule: Host(`cloud.${DOMAIN}`)
      traefik.http.routers.app.service: app
      traefik.http.services.app.loadbalancer.server.port: "8080"
      # Explorador de BBDD (CloudBeaver, contenedor cenit-sqladmin que el portal arranca bajo demanda):
      # la entrada con el pase del portal la atiende el portal...
      traefik.http.routers.sqladmin-enter.rule: Host(`sqladmin.${DOMAIN}`) && PathPrefix(`/__cenit/`)
      traefik.http.routers.sqladmin-enter.priority: "1000"
      traefik.http.routers.sqladmin-enter.service: app
      # ...y si el explorador está apagado (su router no existe), sqladmin.DOMINIO lleva a Cenit.
      traefik.http.routers.sqladmin-off.rule: Host(`sqladmin.${DOMAIN}`)
      traefik.http.routers.sqladmin-off.priority: "1"
      traefik.http.routers.sqladmin-off.service: app
      traefik.http.routers.sqladmin-off.middlewares: sqladmin-off
      traefik.http.middlewares.sqladmin-off.redirectregex.regex: ^https?://[^/]+/?.*
      traefik.http.middlewares.sqladmin-off.redirectregex.replacement: ${PUBLIC_SCHEME}://cloud.${DOMAIN}${PUBLIC_PORT_SUFFIX:-}/admin/herramientas

  # Repositorio NuGet privado (BaGetter). Un único feed: http(s)://nuget.DOMAIN/v3/index.json
  #   - Leer: usuario y contraseña (cenit-admin / CENIT_TOKEN, cenit-apps / NUGET_READ_TOKEN
  #     de solo lectura para las aplicaciones, admin / ADMIN_PASSWORD).
  #   - Subir y borrar: API key = CENIT_TOKEN (dotnet nuget push -k).
  #   - Borrar elimina el paquete de verdad (HardDelete); al subir, la política de retención
  #     borra las versiones antiguas que sobren (NUGET_RETENTION_* en .env).
  #   - Su web pide el login de administración (Traefik); el feed lo autentica BaGetter.
  nuget:
    image: bagetter/bagetter:${BAGETTER_VERSION:-1.6.5}
    restart: unless-stopped
    networks:
      proxy:
      # Las aplicaciones en modo BBDD compartida descargan de aquí sus paquetes (dacpac).
      sql:
        aliases: [cenit-nuget]
    ports:
      # En local los clientes NuGet (dotnet) no resuelven *.localhost: usan localhost:5100.
      - "127.0.0.1:${NUGET_LOCAL_PORT:-5100}:8080"
    environment:
      ApiKey: ${CENIT_TOKEN:-}
      PackageDeletionBehavior: HardDelete
      AllowPackageOverwrites: "false"
      Database__Type: Sqlite
      Database__ConnectionString: Data Source=/data/db/bagetter.db
      Storage__Type: FileSystem
      Storage__Path: /data/packages
      Mirror__Enabled: "false"
      Authentication__Credentials__0__Username: cenit-admin
      Authentication__Credentials__0__Password: ${CENIT_TOKEN:-}
      Authentication__Credentials__1__Username: cenit-apps
      Authentication__Credentials__1__Password: ${NUGET_READ_TOKEN:-}
      Authentication__Credentials__2__Username: admin
      Authentication__Credentials__2__Password: ${ADMIN_PASSWORD}
      # Retención: versiones que se conservan por paquete (hay que definir las cuatro para que actúe).
      Retention__MaxMajorVersions: ${NUGET_RETENTION_MAJOR:-3}
      Retention__MaxMinorVersions: ${NUGET_RETENTION_MINOR:-5}
      Retention__MaxPatchVersions: ${NUGET_RETENTION_PATCH:-5}
      Retention__MaxPrereleaseVersions: ${NUGET_RETENTION_PRERELEASE:-10}
    volumes:
      - nuget_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 10
    labels:
      traefik.enable: "true"
      traefik.http.services.nuget.loadbalancer.server.port: "8080"
      # Feed (/v3, /api): lo autentica BaGetter (usuario/contraseña para leer, API key para subir).
      traefik.http.routers.nuget-feed.rule: Host(`nuget.${DOMAIN}`) && (PathPrefix(`/v3`) || PathPrefix(`/api`) || Path(`/health`))
      traefik.http.routers.nuget-feed.priority: "100"
      traefik.http.routers.nuget-feed.service: nuget
      # Web (lista de paquetes): solo con el login de administración.
      traefik.http.routers.nuget.rule: Host(`nuget.${DOMAIN}`)
      traefik.http.routers.nuget.service: nuget
      traefik.http.routers.nuget.middlewares: cenit-auth

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:${OPENOBSERVE_VERSION:-latest}
    restart: unless-stopped
    environment:
      ZO_ROOT_USER_EMAIL: ${ADMIN_EMAIL}
      ZO_ROOT_USER_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - openobserve_data:/data
    networks:
      - internal
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.telemetry.rule: Host(`telemetry.${DOMAIN}`)
      traefik.http.services.telemetry.loadbalancer.server.port: "5080"
