# Override de producción: HTTPS con certificados de Let's Encrypt (HTTP-01).
# El instalador lo añade automáticamente vía COMPOSE_FILE en infra/.env cuando
# se instala en modo producción.
#
# Todos los routers (los de este stack y los de los productos desplegados)
# heredan TLS + certresolver del entrypoint websecure, así que las etiquetas
# de Traefik son idénticas en local y en producción.

services:
  traefik:
    ports:
      - "443:443"
    volumes:
      - letsencrypt:/letsencrypt
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --api.dashboard=true
      - --log.level=INFO
