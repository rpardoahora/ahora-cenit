# Stack de ahora-cenit para desplegar la imagen publicada por GitHub Actions
# (.github/workflows/docker-build.yml), sin necesidad del código fuente ni
# de reconstruir la imagen en el host. Requiere la red externa `proxy`
# (creada por docker-compose.prod.yml de esta misma carpeta) y las mismas
# variables de entorno que app/.env.prod.example.
#
# Uso:
#   docker compose --env-file .env.prod -f docker-compose-cenit.yml pull
#   docker compose --env-file .env.prod -f docker-compose-cenit.yml up -d
#
# Para desplegar una versión concreta en lugar de la última build de `main`:
#   IMAGE_TAG=sha-<commit> docker compose --env-file .env.prod -f docker-compose-cenit.yml up -d

networks:
  proxy:
    name: proxy
    external: true
  cenit_internal:
    name: cenit_internal

volumes:
  cenit_sqlserver_data:
    name: cenit_sqlserver_data

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    volumes:
      - cenit_sqlserver_data:/var/opt/mssql
    networks:
      - cenit_internal

  app:
    image: ghcr.io/rpardoahora/ahora-cenit:${IMAGE_TAG:-latest}
    pull_policy: always
    container_name: app
    restart: unless-stopped
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Default: Server=sqlserver,1433;Database=AhoraCenit;User Id=sa;Password=${DB_SA_PASSWORD};TrustServerCertificate=True
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: ahora-cenit
      Jwt__ExpiresMinutes: "480"
      Portainer__Url: ${PORTAINER_URL}
      Portainer__ApiKey: ${PORTAINER_API_KEY}
      Portainer__EndpointId: ${PORTAINER_ENDPOINT_ID}
      BaseDomain: ${DOMAIN}
      AdminSeed__Email: ${ADMIN_EMAIL}
      AdminSeed__Password: ${ADMIN_PASSWORD}
      Auth__RequireEmailConfirmation: ${REQUIRE_EMAIL_CONFIRMATION}
      Auth__PublicBaseUrl: ${PUBLIC_BASE_URL}
      Smtp__Host: ${SMTP_HOST}
      Smtp__Port: ${SMTP_PORT}
      Smtp__User: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__From: ${SMTP_FROM}
    networks:
      - cenit_internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.app.loadbalancer.server.port=8080
      - traefik.http.routers.app.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.app.entrypoints=websecure
      - traefik.http.routers.app.tls.certresolver=le
